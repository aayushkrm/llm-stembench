run_id: S1-P1
stage: 1
dataset: mmlu_stem
sample:
  n: 60
  seed: 42
  stratify_by: subject
  split: test
models:
  # OpenRouter free tier: shared 50 req/day -> small n per model today
  - provider: openrouter
    model: google/gemma-4-31b-it:free
    display_name: Gemma-4-31B (Google)
    n_items: 15
  - provider: openrouter
    model: openai/gpt-oss-20b:free
    display_name: GPT-OSS-20B (OpenAI)
    n_items: 15
  - provider: openrouter
    model: z-ai/glm-5.2:free
    display_name: GLM-5.2 (Z.ai)
    n_items: 15
  # Zen free models: no documented account cap -> larger n
  - provider: zen
    model: nemotron-3.5-lightning-free
    display_name: Nemotron-3.5-Lightning (NVIDIA)
    n_items: 60
  - provider: zen
    model: laguna-s-2.1-free
    display_name: Laguna-S-2.1 (Poolside)
    n_items: 60
  - provider: zen
    model: hy3-free
    display_name: HY3 (Tencent Hunyuan)
    n_items: 60
languages: [en]
prompt_template: mc_answer_confidence_v1
output_dir: results
request_timeout_s: 240
max_retries: 3
notes: >-
  Stage 1 pilot, MMLU-STEM stratified sample (seed 42). Six free-tier models across two
  providers. OpenRouter models capped at 15 items by the shared 50/day free budget;
  Zen models 60 items. Zero paid spend enforced by provider allowlists.
