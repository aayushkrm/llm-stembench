run_id: S2-E1
stage: 2
dataset: stembench_v1
sample:
  n: 50        # pairs (RU+EN kept together -> 100 items per model)
  seed: 2026
  stratify_by: subject
  split: test
models:
  - provider: zen
    model: nemotron-3.5-lightning-free
    display_name: Nemotron-3.5-Lightning (NVIDIA)
    n_items: 100
  - provider: zen
    model: laguna-s-2.1-free
    display_name: Laguna-S-2.1 (Poolside)
    n_items: 100
  - provider: zen
    model: hy3-free
    display_name: HY3 (Tencent Hunyuan)
    n_items: 100
  - provider: zen
    model: nemotron-3-ultra-free
    display_name: Nemotron-3-Ultra (NVIDIA, 550B MoE)
    n_items: 100
  - provider: openrouter
    model: google/gemma-4-31b-it:free
    display_name: Gemma-4-31B (Google)
    n_items: 100
  - provider: openrouter
    model: openai/gpt-oss-20b:free
    display_name: GPT-OSS-20B (OpenAI)
    n_items: 100
  - provider: openrouter
    model: z-ai/glm-5.2:free
    display_name: GLM-5.2 (Z.ai)
    n_items: 100
languages: [en, ru]
prompt_template: mc_answer_confidence_v1
output_dir: results
request_timeout_s: 300
max_retries: 3
notes: >-
  Stage 2 evaluation on the original bilingual benchmark (STEMBench v0.1.0-candidate),
  50 pairs stratified by subject, seed 2026. Seven models across two free-tier
  providers. OpenRouter models extend via daily-budget resume (50 req/day free tier);
  Zen models have no documented account cap. Zero paid spend enforced.
